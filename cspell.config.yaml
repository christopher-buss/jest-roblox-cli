version: "0.2"
language: en

# Keep import, dictionaries, dictionaryDefinitions and ignoreRegExpList
# in step with .config/cspell.config.yaml at the monorepo root.
import:
  - "@cspell/parser-typescript/recommended"

dictionaryDefinitions:
  - name: rbxts
    path: ./node_modules/@isentinel/dict-rbxts/dict/rbxts.txt
  - name: roblox
    path: ./node_modules/@isentinel/dict-roblox/dict/roblox.txt

dictionaries:
  - rbxts
  - roblox

# @cspell/parser-typescript 1.3.1 decodes escapes inside String.raw templates.
ignoreRegExpList:
  - '/String\.raw`[^`]*`/g'

words:
  - IMAGENAME
  - NOSYSTEM
  - NSURL
  - NSUTF
  - absolutize
  - absolutized
  - absolutizes
  - arktype
  - begincolumn
  - beginline
  - buildid
  - compoundassign
  - covmap
  - debugname
  - defu
  - difftime
  - dmaas
  - dndebug
  - doublestar
  - elseBlock
  - elseExpr
  - elsebody
  - elseifs
  - emcc
  - emscripten
  - emsdk
  - emxx
  - endcolumn
  - fmod
  - foreachi
  - frexp
  - fwasm
  - getenv
  - getmetatable
  - getn
