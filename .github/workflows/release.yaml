name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-sea:
    needs: release
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install
        run: nci

      - name: Build
        run: nr build

      - name: Rename binary
        run: |
          src="dist/sea/jest-roblox"
          if [[ "${{ matrix.binary }}" == *.exe ]]; then src="${src}.exe"; fi
          mv "$src" "dist/sea/${{ matrix.binary }}"

        shell: bash
      - name: Archive binary
        run: cd dist/sea && 7z a "${{ matrix.archive }}" "${{ matrix.binary }}"
        shell: bash

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Upload archive to release
        run: gh release upload "${{ github.ref_name }}" "dist/sea/${{ matrix.archive }}" --clobber

    strategy:
      matrix:
        include:
          - archive: jest-roblox-linux-x64.zip
            binary: jest-roblox-linux-x64
            os: ubuntu-latest

          - archive: jest-roblox-darwin-arm64.zip
            binary: jest-roblox-darwin-arm64
            os: macos-latest

          - archive: jest-roblox-windows-x64.zip
            binary: jest-roblox-windows-x64.exe
            os: windows-latest

  release:
    permissions:
      contents: write
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install
        run: nci

      - name: Build
        run: nr build

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Generate changelog
        run: pnpx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload plugin to release
        run: gh release upload "${{ github.ref_name }}" plugin/JestRobloxRunner.rbxm --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
