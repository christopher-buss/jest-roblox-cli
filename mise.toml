[env]
_.file = { path = ".env" }
_.path = [
  '{{config_root}}/node_modules/.bin',
  '{{cwd}}/node_modules/.bin',
]

[tools]
"github:jacktabscode/drillbit" = "latest"
"github:johnnymorganz/stylua" = "latest"
"github:luau-lang/lute" = "1.0.0"
"github:rojo-rbx/rojo" = "v7.7.0-rc.1"
"npm:@antfu/ni" = "latest"
"npm:corepack" = "latest"
node = "26.5.0"
watchexec = "latest"

[tasks.dev]
description = "Starts the Rojo server and compiler in watch mode"
alias = "d"
depends = [
  "watch-drillbit",
  "compile --watch",
  "serve" 
]

[tasks.drillbit]
# The `.rbxm` drillbit installs is a build output rather than a checked-in file,
# so the build has to run first or a fresh clone has nothing to install.
run = [
  "pnpm build:plugin",
  "drillbit" 
]
# Inputs only. `plugin/JestRobloxRunner.rbxm` and `plugin/src/version.luau` are
# written by the build above, so watching them would re-trigger this task on its
# own output.
sources = [
  "drillbit.toml",
  "luau/**/*.luau",
  "package.json",
  "plugin/host/**/*.luau",
  "plugin/plugin.project.json",
  "plugin/src/init.server.luau",
  "plugin/src/test-in-run-mode.server.luau"
]

[tasks.watch-drillbit]
run = "mise watch drillbit"
