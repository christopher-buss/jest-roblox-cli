packages:
  - packages/*

overrides:
  "@typescript-eslint/eslint-plugin": 8.72.0
  "@typescript-eslint/parser": 8.72.0
  "@typescript-eslint/type-utils": 8.72.0
  "@typescript-eslint/types": 8.72.0
  "@typescript-eslint/typescript-estree": 8.72.0
  "@typescript-eslint/utils": 8.72.0
  # weld's dts-bundle-generator needs the TypeScript JS API, which 7 lacks.
  dts-bundle-generator>typescript: 6.0.3

minimumReleaseAgeExclude:
  - "@bedrock-rbx/ocale"
  - "@isentinel/eslint-config"

publicHoistPattern:
  - "*@rbxts*"
  - "@typescript/*"

patchedDependencies:
  "@stryker-mutator/vitest-runner@10.0.0": patches/vitest-runner@10.0.0.patch
